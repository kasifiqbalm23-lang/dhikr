<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1420">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nur">
<meta name="description" content="Islamic companion — dhikr counter, hadith, and more">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Nur — Islamic Companion</title>
<style>
  /* ============================================================
     THEME VARS  (all overridden at runtime by JS)
     ============================================================ */
  :root {
    --bg: #0a1420;
    --surface: #131e2e;
    --surface-2: #1a2738;
    --surface-3: #22334a;
    --border: #24344a;
    --border-bright: #324a68;
    --text: #e8eef5;
    --text-2: #8fa3b8;
    --text-3: #5a6a7d;

    --gold: #d4a84b;
    --gold-soft: #e8c878;
    --gold-rgb: 212, 168, 75;

    --blue: #4a90c9;
    --blue-bright: #5fa8e0;
    --blue-rgb: 74, 144, 201;

    --green: #2a8b5c;
    --green-bright: #3ea877;
    --green-rgb: 42, 139, 92;

    --red: #d95a5a;
    --red-rgb: 217, 90, 90;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    transition: background-color 0.5s ease, color 0.5s ease;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(var(--blue-rgb), 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(var(--gold-rgb), 0.06) 0%, transparent 50%);
  }
  .arabic-font { font-family: 'Amiri', serif; }

  /* Smooth cross-fade on theme swap */
  body.theme-transitioning *,
  body.theme-transitioning *::before,
  body.theme-transitioning *::after {
    transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease, box-shadow 0.5s ease !important;
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .screen {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto; overflow-x: hidden;
    transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
    -webkit-overflow-scrolling: touch;
  }
  .screen.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
  .screen.home.hidden { transform: translateX(-25%); opacity: 0; }

  /* ============================================================
     HOME
     ============================================================ */
  .home-header { padding: 8px 0 20px; }

  .greeting-ar {
    font-family: 'Amiri', serif;
    font-size: 30px;
    line-height: 1.3;
    margin-bottom: 6px;
    background: linear-gradient(100deg, var(--gold-soft) 30%, var(--text) 50%, var(--gold-soft) 70%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: textShine 6s linear infinite;
  }
  @keyframes textShine { to { background-position: -200% center; } }

  .greeting-en { font-size: 15px; color: var(--text-2); font-weight: 500; }
  .date-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; font-size: 13px; color: var(--text-3);
    flex-wrap: wrap;
  }
  .date-sep { color: var(--border-bright); }

  .resume-card {
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border-bright);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .resume-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(var(--gold-rgb), 0.14), transparent);
    animation: cardShine 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cardShine {
    0%, 100% { left: -100%; }
    50%      { left: 100%; }
  }
  .resume-card:active { transform: scale(0.98); border-color: var(--gold); }

  .resume-label {
    font-size: 11px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1.2px;
    font-weight: 700; margin-bottom: 10px;
    position: relative;
  }
  .resume-ar {
    font-family: 'Amiri', serif;
    font-size: 26px; color: var(--text);
    direction: rtl; margin-bottom: 4px;
    position: relative;
  }
  .resume-sub { font-size: 13px; color: var(--text-2); margin-bottom: 14px; position: relative; }
  .mini-bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; position: relative; }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--gold));
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .resume-meta {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-3);
    margin-top: 8px; font-weight: 600;
    position: relative;
  }

  .section-title {
    font-size: 12px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 1.5px;
    font-weight: 700; margin-bottom: 14px;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-bottom: 20px;
  }
  .feature-grid.reveal .feature-tile {
    animation: tileReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .feature-grid.reveal .feature-tile:nth-child(1) { animation-delay: 0.00s; }
  .feature-grid.reveal .feature-tile:nth-child(2) { animation-delay: 0.05s; }
  .feature-grid.reveal .feature-tile:nth-child(3) { animation-delay: 0.10s; }
  .feature-grid.reveal .feature-tile:nth-child(4) { animation-delay: 0.15s; }
  .feature-grid.reveal .feature-tile:nth-child(5) { animation-delay: 0.20s; }
  .feature-grid.reveal .feature-tile:nth-child(6) { animation-delay: 0.25s; }
  .feature-grid.reveal .feature-tile:nth-child(7) { animation-delay: 0.30s; }
  .feature-grid.reveal .feature-tile:nth-child(8) { animation-delay: 0.35s; }
  @keyframes tileReveal {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  .feature-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    position: relative;
    min-height: 118px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    text-align: left;
    color: inherit;
    font: inherit;
  }
  .feature-tile:active {
    transform: scale(0.97);
    border-color: var(--border-bright);
    background: var(--surface-2);
  }
  .feature-tile.coming-soon { opacity: 0.55; }
  .feature-tile.coming-soon:active { transform: none; }
  .tile-icon { font-size: 26px; line-height: 1; margin-bottom: 12px; display: block; }
  .tile-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .tile-sub { font-size: 11px; color: var(--text-3); line-height: 1.4; }
  .tile-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 9px; font-weight: 700;
    color: var(--text-3);
    background: var(--surface-3);
    padding: 3px 7px; border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ============================================================
     DHIKR SCREEN
     ============================================================ */
  .feature-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 14px;
    flex-shrink: 0;
  }
  .feature-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn.ghost { background: transparent; border-color: transparent; font-size: 22px; width: 36px; }

  .dhikr-display { text-align: center; padding: 8px 0 16px; flex-shrink: 0; }
  .dhikr-ar {
    font-family: 'Amiri', serif;
    font-size: 38px; font-weight: 700;
    line-height: 1.4; color: var(--text);
    direction: rtl; margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(var(--gold-rgb), 0.18);
  }
  .dhikr-translit { font-size: 16px; color: var(--gold-soft); font-weight: 600; margin-bottom: 3px; }
  .dhikr-meaning { font-size: 12px; color: var(--text-3); }
  .hadith-chip {
    margin-top: 12px;
    background: rgba(var(--blue-rgb), 0.1);
    color: var(--blue-bright);
    border: 1px solid rgba(var(--blue-rgb), 0.25);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
  }
  .hadith-chip:active { background: rgba(var(--blue-rgb), 0.2); }

  /* ---- COUNTER ---- */
  .counter-stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    position: relative;
    padding: 8px 0;
  }
  .counter-wrap {
    position: relative;
    width: min(72vw, 72vh, 340px);
    height: min(72vw, 72vh, 340px);
    display: flex; align-items: center; justify-content: center;
    isolation: isolate;
  }
  .counter-wrap::before {
    content: '';
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--blue-rgb), 0.18), transparent 70%);
    filter: blur(18px);
    z-index: -1;
    animation: glowBreathe 5s ease-in-out infinite;
  }
  @keyframes glowBreathe {
    0%, 100% { transform: scale(1);    opacity: 0.45; }
    50%      { transform: scale(1.18); opacity: 0.85; }
  }

  .progress-ring {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }
  .ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 4; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 4px rgba(var(--gold-rgb), 0.5));
    animation: ringShimmer 3s ease-in-out infinite;
  }
  @keyframes ringShimmer {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(var(--gold-rgb), 0.4)); }
    50%      { filter: drop-shadow(0 0 12px rgba(var(--gold-rgb), 0.8)); }
  }

  .counter {
    width: calc(100% - 24px);
    height: calc(100% - 24px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, var(--surface-2), var(--surface) 75%);
    border: 1px solid var(--border-bright);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.09s ease, background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    box-shadow: 0 0 60px rgba(var(--blue-rgb), 0.1) inset, 0 8px 30px rgba(0,0,0,0.4);
    position: relative;
    color: var(--text);
    font: inherit;
    padding: 0;
    overflow: hidden;
  }
  .counter:active { transform: scale(0.96); }
  .counter.done {
    background: radial-gradient(circle at 30% 25%,
      rgba(var(--green-rgb), 0.35), var(--surface) 78%);
    border-color: var(--green);
    box-shadow: 0 0 90px rgba(var(--green-rgb), 0.35) inset, 0 8px 30px rgba(0,0,0,0.4);
    animation: counterPulse 2.2s ease-in-out infinite;
  }
  @keyframes counterPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }
  .count-num {
    font-size: clamp(48px, 22vw, 88px);
    font-weight: 800;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    transform-origin: 50% 50%;
  }
  .count-total {
    font-size: clamp(14px, 4vw, 20px);
    color: var(--text-3);
    margin-top: 8px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Ripple */
  .ripple {
    position: absolute;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--gold-rgb), 0.7), transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: rippleExpand 0.65s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
  }
  @keyframes rippleExpand {
    from { transform: translate(-50%,-50%) scale(0.4); opacity: 0.85; }
    to   { transform: translate(-50%,-50%) scale(14); opacity: 0; }
  }

  /* Controls */
  .dhikr-controls {
    display: flex; gap: 10px;
    justify-content: center; align-items: center;
    padding: 16px 0 4px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    min-width: 48px;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .ctrl-btn:active { background: var(--surface-2); transform: scale(0.94); }
  .ctrl-btn.reset { color: var(--red); background: rgba(var(--red-rgb), 0.1); border-color: rgba(var(--red-rgb), 0.22); }
  .ctrl-btn.reset.confirm { color: #fff; background: var(--red); border-color: var(--red); }

  /* ============================================================
     SHEETS
     ============================================================ */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(32px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    max-height: 85vh;
    overflow-y: auto;
    border-top: 1px solid var(--border-bright);
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.4);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    margin: -6px auto 16px;
  }
  .sheet-title { font-size: 15px; color: var(--text); margin-bottom: 16px; font-weight: 700; }

  .section-label {
    font-size: 12px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 1.2px;
    font-weight: 700; margin-bottom: 12px;
  }

  /* Theme swatches */
  .theme-swatches {
    display: flex; gap: 12px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    margin-bottom: 22px;
    scrollbar-width: none;
  }
  .theme-swatches::-webkit-scrollbar { display: none; }
  .theme-swatch {
    width: 46px; height: 46px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid var(--border);
    background: var(--sw-bg, #000);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .theme-swatch::before {
    content: '';
    position: absolute; inset: 5px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--sw-a, #fff), var(--sw-b, #000), var(--sw-a, #fff));
  }
  .theme-swatch:active { transform: scale(0.9); }
  .theme-swatch.active {
    border-color: var(--text);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--gold), 0 0 20px rgba(var(--gold-rgb), 0.5);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 20px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .chip:active { transform: scale(0.94); }
  .chip.active {
    background: var(--blue); border-color: var(--blue-bright);
    color: #fff;
    box-shadow: 0 4px 14px rgba(var(--blue-rgb), 0.35);
  }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .switch {
    width: 48px; height: 28px; border-radius: 14px;
    background: var(--surface-3);
    position: relative; cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
    border: none;
    padding: 0;
  }
  .switch.on { background: var(--blue); }
  .switch::after {
    content: ''; position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%; background: #fff;
    top: 3px; left: 3px;
    transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .switch.on::after { left: 23px; }

  .close-sheet {
    width: 100%; padding: 15px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    margin-top: 14px;
  }
  .close-sheet.primary { background: var(--blue); border-color: var(--blue-bright); color: #fff; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s;
    z-index: 9;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  /* Hadith cards */
  .hadith-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .hadith-card .h-arabic {
    font-family: 'Amiri', serif;
    font-size: 22px; line-height: 1.8;
    direction: rtl; color: var(--text);
    margin-bottom: 12px; text-align: right;
  }
  .hadith-card .h-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text-2);
    margin-bottom: 12px;
    user-select: text; -webkit-user-select: text;
  }
  .hadith-card .h-ref {
    font-size: 12px; color: var(--text-3);
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .hadith-card .h-ref a { color: var(--blue-bright); text-decoration: none; }
  .hadith-card .h-grade {
    font-size: 11px; color: var(--green-bright);
    background: rgba(var(--green-rgb), 0.12);
    padding: 3px 9px; border-radius: 10px;
    display: inline-block; margin-top: 10px;
    font-weight: 600;
  }
  .hadith-topic-badge {
    display: inline-block;
    background: rgba(var(--blue-rgb), 0.14);
    color: var(--blue-bright);
    font-size: 11px; padding: 4px 11px;
    border-radius: 10px; margin-bottom: 12px;
    font-weight: 700;
  }

  .loading-box {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-3);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 22px; height: 22px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================================
     TOAST / CONFETTI / BG ORBS
     ============================================================ */
  #toast {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-3);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    border: 1px solid var(--border-bright);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-width: 80vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #confettiLayer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    will-change: transform, opacity;
    animation: confettiFall var(--dur, 1.2s) cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
  }

    { text: 'The Prophet (ﷺ) said: "The example of the one who celebrates the Praises of his Lord (Allah) in comparison to the one who does not celebrate the Praises of his Lord, is that of a living creature compared to a dead one."', ref: 'Sahih al-Bukhari 6407', url: 'https://sunnah.com/bukhari:6407' },
    { text: 'The Prophet (ﷺ) said that Allah has angels who travel around the earth, and when they pass by people remembering Allah, they call out to one another to come to what they are seeking.', ref: 'Sahih al-Bukhari 6408', url: 'https://sunnah.com/bukhari:6408' },
    { text: 'Whoever says "Subhan Allah" one hundred times, one thousand good deeds will be recorded for him or one thousand sins will be blotted out from his record.', ref: 'Riyad as-Salihin 1431', url: 'https://sunnah.com/riyadussalihin:1431' },
    { text: 'The Prophet (ﷺ) used to remember Allah, the Great and Majestic, at all moments.', ref: 'Sunan Abi Dawud 18', url: 'https://sunnah.com/abudawud:18' }
  ];

  const TARGETS = [33, 99, 100, 500, 1000];
  const API_BASE = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/';
  const EDITIONS = [
    { slug: 'eng-bukhari',  name: 'Sahih al-Bukhari',   sunnah: 'bukhari'   },
    { slug: 'eng-muslim',   name: 'Sahih Muslim',       sunnah: 'muslim'    },
    { slug: 'eng-abudawud', name: 'Sunan Abi Dawud',    sunnah: 'abudawud'  },
    { slug: 'eng-tirmidhi', name: "Jami' at-Tirmidhi",  sunnah: 'tirmidhi'  },
    { slug: 'eng-nasai',    name: "Sunan an-Nasa'i",    sunnah: 'nasai'     },
    { slug: 'eng-ibnmajah', name: 'Sunan Ibn Majah',    sunnah: 'ibnmajah'  },
    { slug: 'eng-malik',    name: 'Muwatta Malik',      sunnah: 'malik'     },
    { slug: 'eng-nawawi',   name: '40 Hadith Nawawi',   sunnah: 'nawawi40'  },
    { slug: 'eng-qudsi',    name: '40 Hadith Qudsi',    sunnah: 'qudsi40'   }
  ];

  const STATE_KEY = 'nur_state_v3';
  const LEGACY_KEY = 'nur_state_v2';
  const PREFERS_REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     HELPERS
     ============================================================ */
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
  const on = (el, evt, fn, opts) => { if (el) el.addEventListener(evt, fn, opts); };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

  function toast(msg) {
    let el = $('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2000);
  }

  /* ============================================================
     STATE
     ============================================================ */
  function defaultState() {
    return {
      idx: 0, target: 33, vib: true, theme: 'midnight',
      presets: PRESETS.map(() => ({ count: 0, total: 0 }))
    };
  }

  function loadState() {
    for (const key of [STATE_KEY, LEGACY_KEY]) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const p = JSON.parse(raw);
        const s = defaultState();
        s.idx = (typeof p.idx === 'number' && p.idx >= 0 && p.idx < PRESETS.length) ? p.idx : 0;
        s.target = (typeof p.target === 'number' && p.target > 0) ? p.target : 33;
        s.vib = (typeof p.vib === 'boolean') ? p.vib : true;
        s.theme = (p.theme && THEMES[p.theme]) ? p.theme : 'midnight';
        if (Array.isArray(p.presets)) {
          s.presets = PRESETS.map((_, i) => {
            const src = p.presets[i];
            return (src && typeof src.count === 'number' && typeof src.total === 'number')
              ? { count: clamp(src.count, 0, 1e9), total: clamp(src.total, 0, 1e9) }
              : { count: 0, total: 0 };
          });
        }
        return s;
      } catch (e) { /* try next key */ }
    }
    return defaultState();
  }

  let state = loadState();
  const preset = () => state.presets[state.idx];

  let saveTimer = null;
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 200);
  }
  function save() {
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function vibe(pattern) {
    if (!state.vib) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  /* ============================================================
     THEME
     ============================================================ */
  function applyTheme(key, animate) {
    const t = THEMES[key] || THEMES.midnight;
    const root = document.documentElement;
    if (animate && !PREFERS_REDUCED) {
      document.body.classList.add('theme-transitioning');
      setTimeout(() => document.body.classList.remove('theme-transitioning'), 550);
    }
    Object.entries(t.vars).forEach(([k, v]) => root.style.setProperty('--' + k, v));
    document.body.dataset.theme = key;
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t.vars.bg);
    // re-render theme swatches
    document.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.theme === key);
    });
  }

  function renderThemeSwatches() {
    const box = $('themeSwatches');
    if (!box) return;
    box.innerHTML = '';
    THEME_KEYS.forEach(key => {
      const t = THEMES[key];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'theme-swatch' + (state.theme === key ? ' active' : '');
      b.dataset.theme = key;
      b.setAttribute('aria-label', t.name + ' theme');
      b.style.setProperty('--sw-bg', t.preview.bg);
      b.style.setProperty('--sw-a', t.preview.a);
      b.style.setProperty('--sw-b', t.preview.b);
      b.addEventListener('click', () => {
        if (state.theme === key) return;
        state.theme = key;
        save();
        applyTheme(key, true);
        vibe(25);
        toast(t.name + ' theme');
      });
      box.appendChild(b);
    });
  }

  /* ============================================================
     SCREEN ROUTER
     ============================================================ */
  function replayTiles() {
    const g = $('featureGrid');
    if (!g) return;
    g.classList.remove('reveal');
    void g.offsetWidth;
    g.classList.add('reveal');
  }

  function showScreen(name) {
    const home = $('homeScreen');
    const dhikr = $('dhikrScreen');
    if (!home || !dhikr) return;
    if (name === 'home') {
      dhikr.classList.add('hidden');
      home.classList.remove('hidden');
      renderResume();
      replayTiles();
    } else if (name === 'dhikr') {
      home.classList.add('hidden');
      dhikr.classList.remove('hidden');
      renderHeader();
      renderCounter();
    }
  }

  /* ============================================================
     RENDERERS
     ============================================================ */
  function renderResume() {
    const p = PRESETS[state.idx], ps = preset();
    if (!p) return;
    $('resumeAr').textContent = p.arabic;
    $('resumeSub').textContent = p.translit + ' — ' + p.meaning;
    const pct = state.target > 0 ? Math.min(100, (ps.count / state.target) * 100) : 0;
    $('resumeBar').style.width = pct + '%';
    $('resumeCount').textContent = ps.count + ' / ' + state.target;
    $('resumeTotal').textContent = 'Total: ' + ps.total;
  }

  function renderDates() {
    try {
      const now = new Date();
      $('gregDate').textContent = new Intl.DateTimeFormat('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      }).format(now);
    } catch (e) { $('gregDate').textContent = ''; }

    try {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-US-u-ca-islamic', {
        day: 'numeric', month: 'long', year: 'numeric'
      }).formatToParts(now);
      let d = '', m = '', y = '';
      for (const p of parts) {
        if (p.type === 'day') d = p.value;
        else if (p.type === 'month') m = p.value;
        else if (p.type === 'year') y = (p.value || '').replace(/\s*AH/, '');
      }
      $('hijriDate').textContent = d + ' ' + m + ' ' + y + ' AH';
    } catch (e) { $('hijriDate').textContent = ''; }
  }

  const RING_R = 46;
  const RING_CIRC = 2 * Math.PI * RING_R;

  function renderHeader() {
    const p = PRESETS[state.idx];
    if (!p) return;
    $('arabic').textContent = p.arabic;
    $('translit').textContent = p.translit;
    $('meaning').textContent = p.meaning;
  }

  function renderCounter() {
    const ps = preset(), p = PRESETS[state.idx];
    $('count').textContent = ps.count;
    $('targetDisplay').textContent = '/ ' + state.target;
    const c = $('counter');
    c.classList.toggle('done', ps.count >= state.target && ps.count > 0);
    c.setAttribute('aria-label', `${ps.count} of ${state.target} — ${p.translit}`);

    const ring = $('ringFill');
    const progress = state.target > 0 ? Math.min(1, ps.count / state.target) : 0;
    ring.setAttribute('stroke-dasharray', String(RING_CIRC));
    ring.setAttribute('stroke-dashoffset', String(RING_CIRC * (1 - progress)));
  }

  function initChips() {
    const tc = $('targetChips');
    if (!tc) return;
    tc.innerHTML = '';
    TARGETS.forEach(t => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'chip';
      el.textContent = t;
      el.dataset.target = String(t);
      el.addEventListener('click', () => setTarget(t));
      tc.appendChild(el);
    });
    renderChips();
  }
  function renderChips() {
    document.querySelectorAll('#targetChips .chip').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.target) === state.target);
    });
  }
  function renderVib() {
    const el = $('vibSwitch');
    if (el) el.classList.toggle('on', state.vib);
  }

  function renderVirtues() {
    const box = $('virtuesList');
    if (!box) return;
    box.innerHTML = '';
    VIRTUES.forEach(v => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML =
        '<div class="h-text">' + esc(v.text) + '</div>' +
        '<div class="h-ref"><span>' + esc(v.ref) + '</span>' +
        '<a href="' + esc(v.url) + '" target="_blank" rel="noopener noreferrer">sunnah.com ↗</a></div>';
      box.appendChild(card);
    });
  }

  function renderPresetHadith() {
    const p = PRESETS[state.idx];
    if (!p) return;
    $('hadithTitle').textContent = '📖 ' + p.translit;
    const box = $('hadithContent');
    if (!box) return;
    box.innerHTML = '';
    if (!p.hadith || !p.hadith.length) {
      box.innerHTML = '<p style="color:var(--text-3);font-size:14px;">No specific hadith linked to this dhikr yet.</p>';
      return;
    }
    p.hadith.forEach(h => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML =
        '<div class="h-arabic">' + esc(h.arabic) + '</div>' +
        '<div class="h-text">' + esc(h.text) + '</div>' +
        '<div class="h-ref"><span>' + esc(h.ref) + '</span>' +
        '<a href="' + esc(h.url) + '" target="_blank" rel="noopener noreferrer">sunnah.com ↗</a></div>' +
        '<div class="h-grade">' + esc(h.grade) + '</div>';
      box.appendChild(card);
    });
  }

  /* ============================================================
     HADITH CACHE (IndexedDB)
     ============================================================ */
  const IDB_NAME = 'nur-hadith-v1';
  const IDB_STORE = 'editions';
  const memCache = new Map();
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((res, rej) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) {
          req.result.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return dbPromise;
  }
  async function idbGet(k) {
    try {
      const db = await openDB();
      return await new Promise((res, rej) => {
        const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { return null; }
  }
  async function idbSet(k, v) {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(v, k);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch {}
  }
  function compact(list) {
    return list.map(h => ({
      hadithnumber: h.hadithnumber || h.hadithNumber || h.id || '?',
      text: h.text || (h.english && h.english.text) || '',
      grades: (h.grades || []).map(g => ({ grade: g.grade || '', name: g.name || '' }))
    }));
  }
  const isAuthentic = h => !h.grades || !h.grades.length ||
    h.grades.some(g => /sahih|hasan/i.test(g.grade || ''));

  async function loadEdition(ed) {
    if (memCache.has(ed.slug)) return memCache.get(ed.slug);
    const cached = await idbGet(ed.slug);
    if (Array.isArray(cached) && cached.length) {
      memCache.set(ed.slug, cached); return cached;
    }
    let res = await fetch(API_BASE + ed.slug + '.min.json', { mode: 'cors' });
    if (!res.ok) {
      res = await fetch(API_BASE + ed.slug + '.json', { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    const raw = Array.isArray(data) ? data : (data.hadiths || []);
    if (!raw.length) throw new Error('Empty edition');
    let list = compact(raw);
    const good = list.filter(isAuthentic);
    if (good.length) list = good;
    memCache.set(ed.slug, list);
    idbSet(ed.slug, list);
    return list;
  }

  async function showRandomHadith() {
    const box = $('randomHadithContent');
    if (!box) return;
    box.innerHTML = '<div class="loading-box"><div class="spinner"></div><br>Loading hadith…</div>';
    const ed = EDITIONS[Math.floor(Math.random() * EDITIONS.length)];
    try {
      const list = await loadEdition(ed);
      const h = list[Math.floor(Math.random() * list.length)];
      const url = 'https://sunnah.com/' + ed.sunnah + ':' + h.hadithnumber;
      const grades = (h.grades || []).map(g => g.grade).filter(Boolean).join(' · ');
      box.innerHTML =
        '<div class="hadith-card" style="border-color:var(--blue);">' +
          '<div class="hadith-topic-badge">' + esc(ed.name) + '</div>' +
          '<div class="h-text">' + esc(h.text) + '</div>' +
          '<div class="h-ref"><span>' + esc(ed.name) + ' #' + esc(h.hadithnumber) + '</span>' +
          '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">sunnah.com ↗</a></div>' +
          (grades ? '<div class="h-grade">' + esc(grades) + '</div>' : '') +
        '</div>';
    } catch (err) {
      box.innerHTML =
        '<div class="hadith-card" style="border-color:var(--red);">' +
          '<div class="h-text" style="color:var(--red);">Couldn\'t load: ' + esc(err.message || 'unknown') + '</div>' +
          '<div class="h-text" style="font-size:12px;margin-top:10px;">Tap "Another Hadith" to try again.</div>' +
        '</div>';
    }
  }

  /* ============================================================
     FLASHY ANIMATIONS
     ============================================================ */
  function spawnRipple(counter, clientX, clientY) {
    if (PREFERS_REDUCED) return;
    const rect = counter.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = (clientX - rect.left) + 'px';
    r.style.top = (clientY - rect.top) + 'px';
    counter.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
    setTimeout(() => r.remove(), 900);
  }

  function popNumber() {
    if (PREFERS_REDUCED) return;
    const n = $('count');
    if (!n) return;
    try {
      n.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }],
        { duration: 260, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
      );
    } catch {}
  }

  function pulseCounter() {
    if (PREFERS_REDUCED) return;
    const c = $('counter');
    if (!c) return;
    try {
      c.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
      );
    } catch {}
  }

  function burstConfetti() {
    if (PREFERS_REDUCED) return;
    const layer = $('confettiLayer');
    const counter = $('counter');
    if (!layer || !counter) return;

    const cs = getComputedStyle(document.documentElement);
    const read = name => (cs.getPropertyValue(name) || '').trim();
    const palette = [
      read('--gold') || '#d4a84b',
      read('--blue') || '#4a90c9',
      read('--green') || '#3ea877',
      read('--gold-soft') || '#e8c878'
    ];

    const rect = counter.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const N = 40;
    for (let i = 0; i < N; i++) {
      const p = document.createElement('span');
      p.className = 'confetti-piece';
      const angle = (Math.PI * 2 * i) / N + (Math.random() - 0.5) * 0.4;
      const dist = 130 + Math.random() * 190;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = palette[i % palette.length];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', (Math.sin(angle) * dist + 120) + 'px');
      p.style.setProperty('--rot', ((Math.random() * 900 - 450) | 0) + 'deg');
      p.style.setProperty('--dur', (0.9 + Math.random() * 0.6).toFixed(2) + 's');
      if (i % 3 === 0) {
        p.style.borderRadius = '2px';
        p.style.width = '6px';
        p.style.height = '10px';
      }
      layer.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  function tap(e) {
    const ps = preset();
    const wasComplete = ps.count >= state.target;

    if (ps.count >= state.target) {
      ps.count = 1;
      ps.total += 1;
      vibe([0, 30]);
    } else {
      ps.count += 1;
      ps.total += 1;
      if (ps.count === state.target) vibe([0, 80, 60, 80, 60, 120]);
      else vibe([0, 30]);
    }

    if (e && e.clientX != null && e.type === 'click') {
      spawnRipple($('counter'), e.clientX, e.clientY);
    }
    popNumber();
    if (!wasComplete && ps.count === state.target) {
      burstConfetti();
      pulseCounter();
      toast('MashaAllah — target reached');
    }

    saveSoon();
    renderCounter();
  }

  function undo() {
    const ps = preset();
    if (ps.total === 0) { toast('Nothing to undo'); return; }
    ps.total -= 1;
    if (ps.count === 0) ps.count = Math.max(0, state.target - 1);
    else ps.count -= 1;
    saveSoon();
    renderCounter();
    vibe(15);
  }

  let resetArmTimer = null;
  function resetPress() {
    const btn = $('resetBtn');
    if (btn.classList.contains('confirm')) {
      clearTimeout(resetArmTimer);
      btn.classList.remove('confirm');
      btn.textContent = 'Reset';
      const ps = preset();
      ps.count = 0; ps.total = 0;
      save(); renderCounter();
      vibe([0, 40, 40, 40]);
      toast('Reset');
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = 'Sure?';
    vibe(20);
    clearTimeout(resetArmTimer);
    resetArmTimer = setTimeout(() => {
      btn.classList.remove('confirm');
      btn.textContent = 'Reset';
    }, 3000);
  }

  function setTarget(t) {
    if (t === state.target) return;
    state.target = t;
    const ps = preset();
    if (ps.count > t) ps.count = 0;
    save(); renderChips(); renderCounter(); vibe(20);
  }

  function switchPreset(dir) {
    state.idx = (state.idx + dir + PRESETS.length) % PRESETS.length;
    save(); renderHeader(); renderCounter(); vibe(15);
    toast(PRESETS[state.idx].translit);
  }

  /* ============================================================
     SHEETS
     ============================================================ */
  function closeAllSheets() {
    ['hadithSheet', 'settingsSheet', 'randomHadithSheet'].forEach(id => {
      const el = $(id); if (el) el.classList.remove('open');
    });
    const ov = $('overlay'); if (ov) ov.classList.remove('open');
  }
  function openSheet(id) {
    closeAllSheets();
    const s = $(id); if (s) s.classList.add('open');
    const ov = $('overlay'); if (ov) ov.classList.add('open');
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  on($('counter'), 'click', tap);
  on($('counter'), 'contextmenu', e => { e.preventDefault(); undo(); });
  on($('counter'), 'keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); }
  });

  on($('resumeCard'), 'click', () => { vibe(15); showScreen('dhikr'); });
  on($('resumeCard'), 'keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showScreen('dhikr'); }
  });
  on($('backFromDhikr'), 'click', () => { vibe(15); showScreen('home'); });

  document.querySelectorAll('.feature-tile').forEach(tile => {
    on(tile, 'click', () => {
      if (tile.classList.contains('coming-soon')) { vibe(20); return; }
      vibe(15);
      const f = tile.dataset.feature;
      if (f === 'dhikr') showScreen('dhikr');
      else if (f === 'hadith') { openSheet('randomHadithSheet'); showRandomHadith(); }
    });
  });

  on($('settingsBtn'), 'click', () => {
    renderThemeSwatches();
    renderVirtues();
    openSheet('settingsSheet');
  });
  on($('closeSettings'), 'click', closeAllSheets);

  on($('hadithBtn'), 'click', () => { renderPresetHadith(); openSheet('hadithSheet'); });
  on($('closeHadith'), 'click', closeAllSheets);
  on($('closeRandomHadith'), 'click', closeAllSheets);
  on($('newRandomHadith'), 'click', () => { showRandomHadith(); vibe(15); });
  on($('overlay'), 'click', closeAllSheets);

  on($('resetBtn'), 'click', resetPress);
  on($('undoBtn'), 'click', undo);
  on($('prevBtn'), 'click', () => switchPreset(-1));
  on($('nextBtn'), 'click', () => switchPreset(1));

  on($('vibSwitch'), 'click', () => {
    state.vib = !state.vib;
    save(); renderVib();
    if (state.vib) vibe(30);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllSheets();
  });

  on(window, 'pagehide', save);
  on(document, 'visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

  /* ============================================================
     BOOT
     ============================================================ */
  try { applyTheme(state.theme, false); } catch (e) { console.error('boot theme', e); }
  try { renderDates(); } catch (e) { console.error('boot dates', e); }
  try { renderResume(); } catch (e) { console.error('boot resume', e); }
  try { initChips(); } catch (e) { console.error('boot chips', e); }
  try { renderVib(); } catch (e) { console.error('boot vib', e); }
  try { renderHeader(); renderCounter(); } catch (e) { console.error('boot dhikr', e); }
  try { replayTiles(); } catch (e) { console.error('boot tiles', e); }
})();
</script>
</body>
</html>
