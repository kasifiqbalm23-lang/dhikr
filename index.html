<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1420">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nur">
<meta name="description" content="Islamic companion — dhikr counter, hadith, and more">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Nur — Islamic Companion</title>
<style>
  :root {
    --bg: #0a1420;
    --surface: #131e2e;
    --surface-2: #1a2738;
    --surface-3: #22334a;
    --border: #24344a;
    --border-bright: #324a68;
    --text: #e8eef5;
    --text-2: #8fa3b8;
    --text-3: #5a6a7d;
    --gold: #d4a84b;
    --gold-soft: #e8c878;
    --blue: #4a90c9;
    --blue-bright: #5fa8e0;
    --green: #2a8b5c;
    --green-bright: #3ea877;
    --red: #d95a5a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(74, 144, 201, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(212, 168, 75, 0.06) 0%, transparent 50%);
  }
  .arabic-font { font-family: 'Amiri', serif; }
  .selectable { user-select: text; -webkit-user-select: text; }

  .screen {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto; overflow-x: hidden;
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s ease;
    -webkit-overflow-scrolling: touch;
  }
  .screen.hidden {
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }
  .screen.home.hidden {
    transform: translateX(-25%);
    opacity: 0;
  }

  .home-header { padding: 8px 0 20px; }
  .greeting-ar {
    font-family: 'Amiri', serif;
    font-size: 30px;
    color: var(--gold-soft);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .greeting-en { font-size: 15px; color: var(--text-2); font-weight: 500; }
  .date-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; font-size: 13px; color: var(--text-3);
    flex-wrap: wrap;
  }
  .date-sep { color: var(--border-bright); }

  .resume-card {
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border-bright);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .resume-card:active { transform: scale(0.98); border-color: var(--gold); }
  .resume-label {
    font-size: 11px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1.2px;
    font-weight: 700; margin-bottom: 10px;
  }
  .resume-ar {
    font-family: 'Amiri', serif;
    font-size: 26px; color: var(--text);
    direction: rtl; margin-bottom: 4px;
  }
  .resume-sub { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
  .mini-bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--gold));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .resume-meta {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-3);
    margin-top: 8px; font-weight: 600;
  }

  .section-title {
    font-size: 12px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 1.5px;
    font-weight: 700; margin-bottom: 14px;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-bottom: 20px;
  }
  .feature-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    position: relative;
    min-height: 118px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    text-align: left;
    color: inherit;
    font: inherit;
  }
  .feature-tile:active {
    transform: scale(0.97);
    border-color: var(--border-bright);
    background: var(--surface-2);
  }
  .feature-tile.coming-soon { opacity: 0.55; }
  .feature-tile.coming-soon:active { transform: none; }
  .tile-icon { font-size: 26px; line-height: 1; margin-bottom: 12px; display: block; }
  .tile-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .tile-sub { font-size: 11px; color: var(--text-3); line-height: 1.4; }
  .tile-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 9px; font-weight: 700;
    color: var(--text-3);
    background: var(--surface-3);
    padding: 3px 7px; border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .feature-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 14px;
    flex-shrink: 0;
  }
  .feature-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn.ghost {
    background: transparent;
    border-color: transparent;
    font-size: 22px;
    width: 36px;
  }

  .dhikr-display {
    text-align: center;
    padding: 8px 0 16px;
    flex-shrink: 0;
  }
  .dhikr-ar {
    font-family: 'Amiri', serif;
    font-size: 38px; font-weight: 700;
    line-height: 1.4; color: var(--text);
    direction: rtl; margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(212, 168, 75, 0.15);
  }
  .dhikr-translit { font-size: 16px; color: var(--gold-soft); font-weight: 600; margin-bottom: 3px; }
  .dhikr-meaning { font-size: 12px; color: var(--text-3); }
  .hadith-chip {
    margin-top: 12px;
    background: rgba(74, 144, 201, 0.1);
    color: var(--blue-bright);
    border: 1px solid rgba(74, 144, 201, 0.25);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  .hadith-chip:active { background: rgba(74, 144, 201, 0.2); }

  .counter-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
    padding: 8px 0;
  }
  .counter-wrap {
    position: relative;
    width: min(72vw, 72vh, 340px);
    height: min(72vw, 72vh, 340px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .progress-ring {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }
  .ring-bg {
    fill: none;
    stroke: var(--surface-3);
    stroke-width: 4;
  }
  .ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .counter {
    width: calc(100% - 24px);
    height: calc(100% - 24px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, var(--surface-2), var(--surface) 75%);
    border: 1px solid var(--border-bright);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 0 60px rgba(74, 144, 201, 0.1) inset, 0 8px 30px rgba(0, 0, 0, 0.4);
    position: relative;
    color: var(--text);
    font: inherit;
    padding: 0;
  }
  .counter:active { transform: scale(0.96); }
  .counter.done {
    background: radial-gradient(circle at 30% 25%, #1a4a35, #0f2e22 75%);
    border-color: var(--green);
    box-shadow: 0 0 70px rgba(62, 168, 119, 0.25) inset, 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  .count-num {
    font-size: clamp(48px, 22vw, 88px);
    font-weight: 800;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .count-total {
    font-size: clamp(14px, 4vw, 20px);
    color: var(--text-3);
    margin-top: 8px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .dhikr-controls {
    display: flex; gap: 10px;
    justify-content: center; align-items: center;
    padding: 16px 0 4px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    min-width: 48px;
  }
  .ctrl-btn:active { background: var(--surface-2); }
  .ctrl-btn.reset { color: #ff9b9b; background: rgba(217, 90, 90, 0.1); border-color: rgba(217, 90, 90, 0.2); }
  .ctrl-btn.confirm { color: #fff; background: var(--red); border-color: var(--red); }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(32px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 10;
    max-height: 85vh;
    overflow-y: auto;
    border-top: 1px solid var(--border-bright);
    -webkit-overflow-scrolling: touch;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    margin: -6px auto 16px;
  }
  .sheet-title {
    font-size: 15px; color: var(--text);
    margin-bottom: 16px; font-weight: 700;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 20px;
    font-size: 13px; cursor: pointer;
    font-weight: 600;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .chip.active {
    background: var(--blue); border-color: var(--blue-bright);
    color: #fff;
    box-shadow: 0 4px 14px rgba(74, 144, 201, 0.3);
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .switch {
    width: 48px; height: 28px; border-radius: 14px;
    background: var(--surface-3);
    position: relative; cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
    border: none;
    padding: 0;
  }
  .switch.on { background: var(--blue); }
  .switch::after {
    content: ''; position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%; background: #fff;
    top: 3px; left: 3px;
    transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .switch.on::after { left: 23px; }
  .close-sheet {
    width: 100%; padding: 15px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 15px; font-weight: 700;
    margin-top: 14px; cursor: pointer;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
  }
  .close-sheet.primary {
    background: var(--blue); border-color: var(--blue-bright); color: #fff;
  }
  .overlay {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    z-index: 9;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .hadith-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .hadith-card .h-arabic {
    font-family: 'Amiri', serif;
    font-size: 22px; line-height: 1.8;
    direction: rtl; color: var(--text);
    margin-bottom: 12px; text-align: right;
  }
  .hadith-card .h-text {
    font-size: 14px; line-height: 1.65;
    color: var(--text-2);
    margin-bottom: 12px;
    user-select: text;
    -webkit-user-select: text;
  }
  .hadith-card .h-ref {
    font-size: 12px; color: var(--text-3);
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .hadith-card .h-ref a { color: var(--blue-bright); text-decoration: none; }
  .hadith-card .h-grade {
    font-size: 11px; color: var(--green-bright);
    background: rgba(62, 168, 119, 0.1);
    padding: 3px 9px; border-radius: 10px;
    display: inline-block; margin-top: 10px;
    font-weight: 600;
  }
  .hadith-topic-badge {
    display: inline-block;
    background: rgba(74, 144, 201, 0.12);
    color: var(--blue-bright);
    font-size: 11px; padding: 4px 11px;
    border-radius: 10px; margin-bottom: 12px;
    font-weight: 700;
  }
  .virtues-list { margin-bottom: 16px; }

  .loading-box {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-3);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 22px; height: 22px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-3);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    border: 1px solid var(--border-bright);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-width: 80vw;
    text-align: center;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen home" id="homeScreen">
  <div class="home-header">
    <div class="greeting-ar arabic-font">السَّلَامُ عَلَيْكُمْ</div>
    <div class="greeting-en">Peace be upon you</div>
    <div class="date-row">
      <span id="hijriDate">—</span>
      <span class="date-sep">·</span>
      <span id="gregDate">—</span>
    </div>
  </div>

  <div class="resume-card" id="resumeCard" role="button" tabindex="0">
    <div class="resume-label">Continue Dhikr</div>
    <div class="resume-ar arabic-font" id="resumeAr">سُبْحَانَ اللَّهِ</div>
    <div class="resume-sub" id="resumeSub">SubhanAllah — Glory be to Allah</div>
    <div class="mini-bar"><div class="mini-bar-fill" id="resumeBar" style="width: 0%"></div></div>
    <div class="resume-meta">
      <span id="resumeCount">0 / 33</span>
      <span id="resumeTotal">Total: 0</span>
    </div>
  </div>

  <div class="section-title">Features</div>

  <div class="feature-grid">
    <button class="feature-tile" data-feature="dhikr">
      <div class="tile-icon">📿</div>
      <div>
        <div class="tile-name">Dhikr Counter</div>
        <div class="tile-sub">Tasbih with hadith evidence</div>
      </div>
    </button>

    <button class="feature-tile" data-feature="hadith">
      <div class="tile-icon">📚</div>
      <div>
        <div class="tile-name">Random Hadith</div>
        <div class="tile-sub">From the six major collections</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="prayer">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">🕌</div>
      <div>
        <div class="tile-name">Prayer Times</div>
        <div class="tile-sub">Five daily salah times</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="quran">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">📖</div>
      <div>
        <div class="tile-name">Quran</div>
        <div class="tile-sub">Selected surahs &amp; ayat</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="adhkar">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">🌅</div>
      <div>
        <div class="tile-name">Adhkar</div>
        <div class="tile-sub">Morning &amp; evening</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="duas">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">🤲</div>
      <div>
        <div class="tile-name">Duas</div>
        <div class="tile-sub">By occasion &amp; time</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="qibla">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">🧭</div>
      <div>
        <div class="tile-name">Qibla</div>
        <div class="tile-sub">Direction to the Kaaba</div>
      </div>
    </button>

    <button class="feature-tile coming-soon" data-feature="names">
      <div class="tile-badge">Soon</div>
      <div class="tile-icon">✨</div>
      <div>
        <div class="tile-name">99 Names</div>
        <div class="tile-sub">Asma ul-Husna</div>
      </div>
    </button>
  </div>
</div>

<!-- DHIKR -->
<div class="screen hidden" id="dhikrScreen">
  <div class="feature-header">
    <button class="icon-btn ghost" id="backFromDhikr" aria-label="Back">←</button>
    <div class="feature-title">Dhikr Counter</div>
    <button class="icon-btn ghost" id="settingsBtn" aria-label="Settings">⚙️</button>
  </div>

  <div class="dhikr-display">
    <div class="dhikr-ar arabic-font" id="arabic"></div>
    <div class="dhikr-translit" id="translit"></div>
    <div class="dhikr-meaning" id="meaning"></div>
    <button class="hadith-chip" id="hadithBtn">📖 Hadith Evidence</button>
  </div>

  <div class="counter-stage">
    <div class="counter-wrap">
      <svg class="progress-ring" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a90c9"/>
            <stop offset="100%" stop-color="#d4a84b"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="50" cy="50" r="46"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="46"
                stroke-dasharray="289.03" stroke-dashoffset="289.03"/>
      </svg>
      <button class="counter" id="counter" type="button" aria-label="Count dhikr">
        <div class="count-num" id="count">0</div>
        <div class="count-total" id="targetDisplay">/ 33</div>
      </button>
    </div>
  </div>

  <div class="dhikr-controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous dhikr">◀</button>
    <button class="ctrl-btn" id="undoBtn" aria-label="Undo last tap">↶</button>
    <button class="ctrl-btn reset" id="resetBtn">Reset</button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next dhikr">▶</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="hadithSheet" role="dialog" aria-modal="true" aria-labelledby="hadithTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="hadithTitle">📖 Hadith Evidence</div>
  <div id="hadithContent"></div>
  <button class="close-sheet" id="closeHadith">Close</button>
</div>

      hadith: [
        { arabic: 'مَنْ صَلَّى عَلَيَّ صَلَاةً وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرَ صَلَوَاتٍ', text: 'The Prophet (ﷺ) said: "Whoever sends blessings upon me once, Allah will send blessings upon him ten times."', ref: 'Sahih Muslim 408', url: 'https://sunnah.com/muslim:408', grade: 'Sahih' }
      ]

  const VIRTUES = [
    { text: 'The Prophet (ﷺ) said: "The example of the one who celebrates the Praises of his Lord (Allah) in comparison to the one who does not celebrate the Praises of his Lord, is that of a living creature compared to a dead one."', ref: 'Sahih al-Bukhari 6407', url: 'https://sunnah.com/bukhari:6407' },
    { text: 'The Prophet (ﷺ) said that Allah has angels who travel around the earth, and when they pass by people remembering Allah, they call out to one another to come to what they are seeking.', ref: 'Sahih al-Bukhari 6408', url: 'https://sunnah.com/bukhari:6408' },
    { text: 'Whoever says "Subhan Allah" one hundred times, one thousand good deeds will be recorded for him or one thousand sins will be blotted out from his record.', ref: 'Riyad as-Salihin 1431', url: 'https://sunnah.com/riyadussalihin:1431' },
    { text: 'The Prophet (ﷺ) used to remember Allah, the Great and Majestic, at all moments.', ref: 'Sunan Abi Dawud 18', url: 'https://sunnah.com/abudawud:18' }
  ];

  const TARGETS = [33, 99, 100, 500, 1000];
  const API_BASE = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/';
  const EDITIONS = [
    { slug: 'eng-bukhari',  name: 'Sahih al-Bukhari',   sunnah: 'bukhari'   },
    { slug: 'eng-muslim',   name: 'Sahih Muslim',       sunnah: 'muslim'    },
    { slug: 'eng-abudawud', name: 'Sunan Abi Dawud',    sunnah: 'abudawud'  },
    { slug: 'eng-tirmidhi', name: "Jami' at-Tirmidhi",  sunnah: 'tirmidhi'  },
    { slug: 'eng-nasai',    name: "Sunan an-Nasa'i",    sunnah: 'nasai'     },
    { slug: 'eng-ibnmajah', name: 'Sunan Ibn Majah',    sunnah: 'ibnmajah'  },
    { slug: 'eng-malik',    name: 'Muwatta Malik',      sunnah: 'malik'     },
    { slug: 'eng-nawawi',   name: '40 Hadith Nawawi',   sunnah: 'nawawi40'  },
    { slug: 'eng-qudsi',    name: '40 Hadith Qudsi',    sunnah: 'qudsi40'   }
  ];

  const STATE_KEY = 'nur_state_v2';

  /* ============================================================
     HELPERS
     ============================================================ */
  const $ = id => document.getElementById(id);
  const clone = o => JSON.parse(JSON.stringify(o));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  function on(el, evt, fn, opts) { if (el) el.addEventListener(evt, fn, opts); }

  function toast(msg) {
    let el = $('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ============================================================
     STATE
     ============================================================ */
  function defaultState() {
    return {
      idx: 0,
      target: 33,
      vib: true,
      presets: PRESETS.map(() => ({ count: 0, total: 0 }))
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        const s = defaultState();
        s.idx = (typeof p.idx === 'number' && p.idx >= 0 && p.idx < PRESETS.length) ? p.idx : 0;
        s.target = (typeof p.target === 'number' && p.target > 0) ? p.target : 33;
        s.vib = (typeof p.vib === 'boolean') ? p.vib : true;
        if (Array.isArray(p.presets)) {
          s.presets = PRESETS.map((_, i) => {
            const src = p.presets[i];
            return (src && typeof src.count === 'number' && typeof src.total === 'number')
              ? { count: Math.max(0, src.count), total: Math.max(0, src.total) }
              : { count: 0, total: 0 };
          });
        }
        return s;
      }
    } catch (e) { /* fall through */ }

    // Migration from v1
    try {
      const oldIdx = parseInt(localStorage.getItem('dc_idx') || '0', 10) || 0;
      const oldTarget = parseInt(localStorage.getItem('dc_target') || '33', 10) || 33;
      const oldCount = parseInt(localStorage.getItem('dc_count') || '0', 10) || 0;
      const oldTotal = parseInt(localStorage.getItem('dc_total') || '0', 10) || 0;
      const oldVib = localStorage.getItem('dc_vib') !== 'false';
      if (oldCount || oldTotal || oldIdx || oldVib === false) {
        const s = defaultState();
        s.idx = Math.max(0, Math.min(PRESETS.length - 1, oldIdx));
        s.target = TARGETS.indexOf(oldTarget) >= 0 ? oldTarget : 33;
        s.vib = oldVib;
        s.presets[s.idx] = { count: Math.max(0, oldCount), total: Math.max(0, oldTotal) };
        return s;
      }
    } catch (e) { /* ignore */ }

    return defaultState();
  }

  let state = loadState();
  function preset() { return state.presets[state.idx]; }

  let saveTimer = null;
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 200);
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function vibe(pattern) {
    if (!state.vib) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  /* ============================================================
     SCREEN ROUTER
     ============================================================ */
  function showScreen(name) {
    const home = $('homeScreen');
    const dhikr = $('dhikrScreen');
    if (!home || !dhikr) return;
    if (name === 'home') {
      dhikr.classList.add('hidden');
      home.classList.remove('hidden');
      renderResume();
    } else if (name === 'dhikr') {
      home.classList.add('hidden');
      dhikr.classList.remove('hidden');
      renderHeader();
      renderCounter();
    }
  }

  /* ============================================================
     RENDERERS
     ============================================================ */
  function renderResume() {
    try {
      const p = PRESETS[state.idx];
      const ps = preset();
      if (!p) return;
      $('resumeAr').textContent = p.arabic;
      $('resumeSub').textContent = p.translit + ' — ' + p.meaning;
      const pct = state.target > 0 ? Math.min(100, (ps.count / state.target) * 100) : 0;
      $('resumeBar').style.width = pct + '%';
      $('resumeCount').textContent = ps.count + ' / ' + state.target;
      $('resumeTotal').textContent = 'Total: ' + ps.total;
    } catch (e) { console.error('renderResume', e); }
  }

  function renderDates() {
    try {
      const now = new Date();
      const gregFmt = new Intl.DateTimeFormat('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });
      $('gregDate').textContent = gregFmt.format(now);
    } catch (e) { console.error('gregDate', e); }

    try {
      const now = new Date();
      const hijriFmt = new Intl.DateTimeFormat('en-US-u-ca-islamic', {
        day: 'numeric', month: 'long', year: 'numeric'
      });
      const parts = hijriFmt.formatToParts(now);
      let day = '', month = '', year = '';
      for (const p of parts) {
        if (p.type === 'day') day = p.value;
        else if (p.type === 'month') month = p.value;
        else if (p.type === 'year') year = (p.value || '').replace(/\s*AH/, '');
      }
      $('hijriDate').textContent = day + ' ' + month + ' ' + year + ' AH';
    } catch (e) {
      $('hijriDate').textContent = '';
    }
  }

  const RING_R = 46;
  const RING_CIRC = 2 * Math.PI * RING_R;

  function renderHeader() {
    const p = PRESETS[state.idx];
    if (!p) return;
    $('arabic').textContent = p.arabic;
    $('translit').textContent = p.translit;
    $('meaning').textContent = p.meaning;
  }

  function renderCounter() {
    const ps = preset();
    const p = PRESETS[state.idx];
    $('count').textContent = ps.count;
    $('targetDisplay').textContent = '/ ' + state.target;
    const c = $('counter');
    c.classList.toggle('done', ps.count >= state.target && ps.count > 0);
    c.setAttribute('aria-label', `${ps.count} of ${state.target} — ${p.translit}`);

    const ring = $('ringFill');
    const progress = state.target > 0 ? Math.min(1, ps.count / state.target) : 0;
    ring.setAttribute('stroke-dasharray', String(RING_CIRC));
    ring.setAttribute('stroke-dashoffset', String(RING_CIRC * (1 - progress)));
  }

  function renderPresetHadith() {
    const p = PRESETS[state.idx];
    if (!p) return;
    $('hadithTitle').textContent = '📖 ' + p.translit;
    const container = $('hadithContent');
    if (!container) return;
    container.innerHTML = '';
    if (!p.hadith || p.hadith.length === 0) {
      container.innerHTML = '<p style="color:var(--text-3);font-size:14px;">No specific hadith linked to this dhikr yet.</p>';
      return;
    }
    p.hadith.forEach(h => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML =

        '<div class="h-ref"><span>' + esc(h.ref) + '</span>' +
        '<a href="' + esc(h.url) + '" target="_blank" rel="noopener noreferrer">sunnah.com ↗</a></div>' +
        '<div class="h-grade">' + esc(h.grade) + '</div>';
      container.appendChild(card);
    });
  }

  /* ============================================================
     HADITH FETCHING (cached in IndexedDB)
     ============================================================ */
  const IDB_NAME = 'nur-hadith-v1';
  const IDB_STORE = 'editions';
  const memCache = new Map();
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) {
          req.result.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function idbGet(key) {
    try {
      const db = await openDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    } catch (e) { return null; }
  }

  async function idbSet(key, val) {
    try {
      const db = await openDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) { /* quota / private mode — ignore */ }
  }

  // Reduce stored payload: keep only what we render.
  function compact(list) {
    return list.map(h => ({
      hadithnumber: h.hadithnumber || h.hadithNumber || h.id || '?',
      text: h.text || (h.english && h.english.text) || '',
      grades: (h.grades || []).map(g => ({
        grade: g.grade || '', name: g.name || ''
      }))
    }));
  }

  function isAuthentic(record) {
    if (!record.grades || !record.grades.length) return true;
    return record.grades.some(g => /sahih|hasan/i.test(g.grade || ''));
  }

  async function loadEdition(ed) {
    if (memCache.has(ed.slug)) return memCache.get(ed.slug);

    const fromIDB = await idbGet(ed.slug);
    if (fromIDB && Array.isArray(fromIDB) && fromIDB.length) {
      memCache.set(ed.slug, fromIDB);
      return fromIDB;
    }

    const url = API_BASE + ed.slug + '.min.json';
    const fallbackUrl = API_BASE + ed.slug + '.json';
    let res = await fetch(url, { mode: 'cors' });
    if (!res.ok) {
      res = await fetch(fallbackUrl, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    const raw = Array.isArray(data) ? data : (data.hadiths || []);
    if (!raw.length) throw new Error('Empty edition');

    let list = compact(raw);
    const filtered = list.filter(isAuthentic);
    if (filtered.length) list = filtered;

    memCache.set(ed.slug, list);
    idbSet(ed.slug, list); // fire-and-forget
    return list;
  }

  async function showRandomHadith() {
    const container = $('randomHadithContent');
    if (!container) return;
    container.innerHTML = '<div class="loading-box"><div class="spinner"></div><br>Loading hadith…</div>';

    const ed = EDITIONS[Math.floor(Math.random() * EDITIONS.length)];
    try {
      const list = await loadEdition(ed);
      const h = list[Math.floor(Math.random() * list.length)];
      const num = h.hadithnumber;
      const sunnahUrl = 'https://sunnah.com/' + ed.sunnah + ':' + num;

      const gradeBadge = (h.grades && h.grades.length)
        ? '<div class="h-grade">' + esc(h.grades.map(g => g.grade).filter(Boolean).join(' · ')) + '</div>'
        : '';

      container.innerHTML =
        '<div class="hadith-card" style="border-color:var(--blue);">' +
          '<div class="hadith-topic-badge">' + esc(ed.name) + '</div>' +
          '<div class="h-text">' + esc(h.text) + '</div>' +
          '<div class="h-ref"><span>' + esc(ed.name) + ' #' + esc(num) + '</span>' +
          '<a href="' + esc(sunnahUrl) + '" target="_blank" rel="noopener noreferrer">sunnah.com ↗</a></div>' +
          gradeBadge +
        '</div>';
    } catch (err) {
      container.innerHTML =
        '<div class="hadith-card" style="border-color:var(--red);">' +
          '<div class="h-text" style="color:#ff9b9b;">Couldn\'t load: ' + esc(err.message || 'unknown error') + '</div>' +
          '<div class="h-text" style="font-size:12px;margin-top:10px;">Tap "Another Hadith" to try again.</div>' +
        '</div>';
    }
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  function tap() {
    const ps = preset();
    if (ps.count >= state.target) {
      ps.count = 1;
      ps.total += 1;
      vibe([0, 30]);
    } else {
      ps.count += 1;
      ps.total += 1;
      if (ps.count === state.target) vibe([0, 80, 60, 80, 60, 120]);
      else vibe([0, 30]);
    }
    saveSoon();
    renderCounter();
  }

  function undo() {
    const ps = preset();
    if (ps.total === 0) { toast('Nothing to undo'); return; }
    ps.total -= 1;
    if (ps.count === 0) ps.count = Math.max(0, state.target - 1);
    else ps.count -= 1;
    saveSoon();
    renderCounter();
    vibe(15);
  }

  let resetArmTimer = null;
  function resetPress() {
    const btn = $('resetBtn');
    if (btn.classList.contains('confirm')) {
      clearTimeout(resetArmTimer);
      btn.classList.remove('confirm');
      btn.textContent = 'Reset';
      const ps = preset();
      ps.count = 0;
      ps.total = 0;
      save();
      renderCounter();
      vibe([0, 40, 40, 40]);
      toast('Reset');
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = 'Sure?';
    vibe(20);
    clearTimeout(resetArmTimer);
    resetArmTimer = setTimeout(() => {
      btn.classList.remove('confirm');
      btn.textContent = 'Reset';
    }, 3000);
  }

  function setTarget(t) {
    if (t === state.target) return;
    state.target = t;
    const ps = preset();
    if (ps.count > t) ps.count = 0;
    save();
    renderChips();
    renderCounter();
    vibe(20);
  }

  function switchPreset(dir) {
    state.idx = (state.idx + dir + PRESETS.length) % PRESETS.length;
    save();
    renderHeader();
    renderCounter();
    vibe(15);
  }

  /* ============================================================
     SHEETS
     ============================================================ */
  function closeAllSheets() {
    ['hadithSheet', 'settingsSheet', 'randomHadithSheet'].forEach(id => {
      const el = $(id); if (el) el.classList.remove('open');
    });
    const ov = $('overlay'); if (ov) ov.classList.remove('open');
  }

  function openSheet(id) {
    closeAllSheets();
    const s = $(id); if (s) s.classList.add('open');
    const ov = $('overlay'); if (ov) ov.classList.add('open');
  }

  /* ============================================================
     EVENT LISTENERS
     ============================================================ */
  on($('counter'), 'click', tap);

  on($('counter'), 'contextmenu', e => { e.preventDefault(); undo(); });
  on($('counter'), 'keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); }
  });

  on($('resumeCard'), 'click', () => { vibe(15); showScreen('dhikr'); });
  on($('resumeCard'), 'keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showScreen('dhikr'); }
  });
  on($('backFromDhikr'), 'click', () => { vibe(15); showScreen('home'); });

  document.querySelectorAll('.feature-tile').forEach(tile => {
    on(tile, 'click', () => {
      if (tile.classList.contains('coming-soon')) { vibe(20); return; }
      vibe(15);
      const f = tile.dataset.feature;
      if (f === 'dhikr') showScreen('dhikr');
      else if (f === 'hadith') { openSheet('randomHadithSheet'); showRandomHadith(); }
    });
  });

  on($('settingsBtn'), 'click', () => { renderVirtues(); openSheet('settingsSheet'); });
  on($('closeSettings'), 'click', closeAllSheets);

  on($('hadithBtn'), 'click', () => { renderPresetHadith(); openSheet('hadithSheet'); });
  on($('closeHadith'), 'click', closeAllSheets);

  on($('closeRandomHadith'), 'click', closeAllSheets);
  on($('newRandomHadith'), 'click', () => { showRandomHadith(); vibe(15); });

  on($('overlay'), 'click', closeAllSheets);

  on($('resetBtn'), 'click', resetPress);
  on($('undoBtn'), 'click', undo);
  on($('prevBtn'), 'click', () => switchPreset(-1));
  on($('nextBtn'), 'click', () => switchPreset(1));

  on($('vibSwitch'), 'click', () => {
    state.vib = !state.vib;
    save();
    renderVib();
    if (state.vib) vibe(30);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllSheets();
  });

  // Flush pending saves
  on(window, 'pagehide', save);
  on(document, 'visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

  /* ============================================================
     BOOT
     ============================================================ */
  try { renderDates(); } catch (e) { console.error('boot dates', e); }
  try { renderResume(); } catch (e) { console.error('boot resume', e); }
  try { initChips(); } catch (e) { console.error('boot chips', e); }
  try { renderVib(); } catch (e) { console.error('boot vib', e); }
  try { renderHeader(); renderCounter(); } catch (e) { console.error('boot dhikr', e); }
})();
</script>
</body>
</html>
