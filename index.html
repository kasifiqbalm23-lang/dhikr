<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dhikr Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0f1720; color: #e8eef5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  body { display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #8fa3b8; }
  .topbar button { background: #1a2530; color: #e8eef5; border: none; padding: 10px 14px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .topbar button:active { background: #253240; }
  .dhikr-box { text-align: center; margin-top: 4px; }
  .arabic { font-size: 34px; font-weight: 700; line-height: 1.4; color: #f0f6ff; direction: rtl; }
  .translit { font-size: 17px; color: #a8bdd4; margin-top: 6px; }
  .meaning { font-size: 13px; color: #6c8099; margin-top: 4px; }
  .hadith-btn { margin-top: 10px; background: #1e3a5f; color: #8fb4d9; border: 1px solid #2a4a6b; padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .hadith-btn:active { background: #2a4a6b; }
  .counter-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .counter { width: min(68vw, 68vh, 320px); height: min(68vw, 68vh, 320px); border-radius: 50%; background: radial-gradient(circle at 30% 25%, #1e3a5f, #12293f 70%); border: 3px solid #2a4a6b; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.06s ease, background 0.2s ease; box-shadow: 0 0 40px rgba(58, 130, 200, 0.15) inset; }
  .counter:active { transform: scale(0.96); }
  .counter.done { background: radial-gradient(circle at 30% 25%, #1e5f3a, #123f29 70%); border-color: #2a8b5c; box-shadow: 0 0 50px rgba(58, 200, 130, 0.3) inset; }
  .count { font-size: 74px; font-weight: 800; line-height: 1; color: #ffffff; }
  .target { font-size: 22px; color: #8fb4d9; margin-top: 6px; }
  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; padding-bottom: 60px; }
  .controls button { background: #1a2530; color: #e8eef5; border: none; padding: 12px 20px; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .controls button:active { background: #253240; }
  .controls button.reset { background: #3a1a1a; color: #ff9b9b; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #16202b; border-radius: 20px 20px 0 0; padding: 20px 20px 28px; transform: translateY(100%); transition: transform 0.25s ease; z-index: 10; max-height: 82vh; overflow-y: auto; border-top: 1px solid #253240; }
  .sheet.open { transform: translateY(0); }
  .sheet h3 { font-size: 15px; color: #8fa3b8; margin-bottom: 10px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { background: #1e2b38; color: #cfe0f0; border: 1px solid #2a3a4a; padding: 10px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; }
  .chip.active { background: #2a6b9a; border-color: #3a90c9; color: #fff; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid #253240; }
  .switch { width: 50px; height: 28px; border-radius: 14px; background: #2a3a4a; position: relative; cursor: pointer; transition: background 0.2s; }
  .switch.on { background: #2a6b9a; }
  .switch::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: left 0.2s; }
  .switch.on::after { left: 25px; }
  .close-sheet { width: 100%; padding: 14px; background: #253240; color: #e8eef5; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 12px; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 9; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .hadith-card { background: #16202b; border: 1px solid #253240; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .hadith-card .h-arabic { font-size: 20px; line-height: 1.7; direction: rtl; color: #f0f6ff; margin-bottom: 10px; text-align: right; }
  .hadith-card .h-text { font-size: 14px; line-height: 1.6; color: #cfe0f0; margin-bottom: 10px; }
  .hadith-card .h-ref { font-size: 12px; color: #6c8099; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hadith-card .h-ref a { color: #5a9fd4; text-decoration: none; }
  .hadith-card .h-grade { font-size: 11px; color: #4a8a5a; background: #1a2a1e; padding: 3px 8px; border-radius: 10px; display: inline-block; margin-top: 6px; }
  .virtues-list { margin-bottom: 16px; }
  .hadith-topic-badge { display: inline-block; background: #1e3a5f; color: #8fb4d9; font-size: 11px; padding: 3px 10px; border-radius: 10px; margin-bottom: 10px; font-weight: 600; }
  #randomHadithBtn { position: fixed; bottom: 22px; right: 22px; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #2a6b9a, #1e4a6b); border: 2px solid #3a90c9; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(42, 107, 154, 0.5); z-index: 8; display: flex; align-items: center; gap: 8px; padding: 0 20px; transition: transform 0.1s; }
  #randomHadithBtn:active { transform: scale(0.94); }
  .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #2a6b9a; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <button id="settingsBtn">⚙️</button>
  <div>Total: <span id="total">0</span></div>
  <button id="undoBtn">↩</button>
</div>

<div class="dhikr-box">
  <div class="arabic" id="arabic"></div>
  <div class="translit" id="translit"></div>
  <div class="meaning" id="meaning"></div>
  <button class="hadith-btn" id="hadithBtn">📖 Hadith Evidence</button>
</div>

<div class="counter-wrap">
  <div class="counter" id="counter">
    <div class="count" id="count">0</div>
    <div class="target" id="targetDisplay">/ 33</div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">◀</button>
  <button class="reset" id="resetBtn">Reset</button>
  <button id="nextBtn">▶</button>
</div>

<button id="randomHadithBtn" aria-label="Random hadith">📚 Random Hadith</button>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="hadithSheet">
  <h3 id="hadithTitle">Hadith Evidence</h3>
  <div id="hadithContent"></div>
  <button class="close-sheet" id="closeHadith">Close</button>
</div>

<div class="sheet" id="settingsSheet">
  <h3>Target</h3>
  <div class="chips" id="targetChips"></div>
  <h3>Virtues of Dhikr</h3>
  <div class="virtues-list" id="virtuesList"></div>
  <div class="row">
    <span>Vibration</span>
    <div class="switch on" id="vibSwitch"></div>
  </div>
  <button class="close-sheet" id="closeSettings">Done</button>
</div>

<div class="sheet" id="randomHadithSheet" style="max-height: 78vh;">
  <h3>📖 Hadith of the Moment</h3>
  <div id="randomHadithContent"></div>
  <button class="close-sheet" id="newRandomHadith" style="background: #2a6b9a;">📚 Another Hadith</button>
  <button class="close-sheet" id="closeRandomHadith">Close</button>
</div>

<script>
(function() {
  /* ============================================================
     PRESETS WITH HADITH (kept for offline evidence cards)
     ============================================================ */
  const PRESETS = [
    {
      arabic: 'سُبْحَانَ اللَّهِ', translit: 'SubhanAllah', meaning: 'Glory be to Allah',
      hadith: [
        { arabic: 'كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ', text: 'The Prophet (ﷺ) said: "(There are) two words which are dear to the Beneficent (Allah) and very light (easy) for the tongue (to say), but very heavy in weight in the balance. They are: Subhan-Allahi wa bihamdihi, Subhan-Allahil-Azim."', ref: 'Sahih al-Bukhari 6682', url: 'https://sunnah.com/bukhari:6682', grade: 'Sahih' },
        { arabic: 'مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ', text: 'Whoever says "Subhan Allahi wa bihamdihi" one hundred times a day, his sins will be erased, even if they were as much as the foam of the sea.', ref: 'Sahih al-Bukhari 6405', url: 'https://sunnah.com/bukhari:6405', grade: 'Sahih' }
      ]
    },
    {
      arabic: 'الْحَمْدُ لِلَّهِ', translit: 'Alhamdulillah', meaning: 'All praise is due to Allah',
      hadith: [
        { arabic: 'أَفْضَلُ الذِّكْرِ لَا إِلَهَ إِلَّا اللَّهُ وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ', text: 'The Messenger of Allah (ﷺ) said: "The best remembrance is: \'there is none worthy of worship except Allah\' and the best supplication is: \'All praise is due to Allah.\'"', ref: 'Jami` at-Tirmidhi 3383', url: 'https://sunnah.com/tirmidhi:3383', grade: 'Hasan' }
      ]
    },
    {
      arabic: 'اللَّهُ أَكْبَرُ', translit: 'Allahu Akbar', meaning: 'Allah is the Greatest',
      hadith: [
        { arabic: 'مَنْ سَبَّحَ اللَّهَ فِي دُبُرِ كُلِّ صَلَاةٍ ثَلَاثًا وَثَلَاثِينَ وَحَمِدَ اللَّهَ ثَلَاثًا وَثَلَاثِينَ وَكَبَّرَ اللَّهَ ثَلَاثًا وَثَلَاثِينَ فَتِلْكَ تِسْعَةٌ وَتِسْعُونَ', text: 'If anyone extols Allah after every prayer thirty-three times, and praises Allah thirty-three times, and declares His Greatness thirty-three times, ninety-nine times in all, and says to complete a hundred: "There is no god but Allah, having no partner with Him, to Him belongs sovereignty and to Him is praise due, and He is Potent over everything," his sins will be forgiven even if these are as abundant as the foam of the sea.', ref: 'Sahih Muslim 597a', url: 'https://sunnah.com/muslim:597a', grade: 'Sahih' }
      ]
    },
    {
      arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ', translit: 'La ilaha illa Allah', meaning: 'There is no deity but Allah',
      hadith: [
        { arabic: 'أَفْضَلُ الذِّكْرِ لَا إِلَهَ إِلَّا اللَّهُ وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ', text: 'The Messenger of Allah (ﷺ) said: "The best remembrance is: \'there is none worthy of worship except Allah\' and the best supplication is: \'All praise is due to Allah.\'"', ref: 'Jami` at-Tirmidhi 3383', url: 'https://sunnah.com/tirmidhi:3383', grade: 'Hasan' }
      ]
    },
    {
      arabic: 'أَسْتَغْفِرُ اللَّهَ', translit: 'Astaghfirullah', meaning: 'I seek forgiveness from Allah',
      hadith: [
        { arabic: 'إِنَّهُ لَيُغَانُ عَلَى قَلْبِي وَإِنِّي لَأَسْتَغْفِرُ اللَّهَ فِي الْيَوْمِ مِائَةَ مَرَّةٍ', text: 'The Prophet (ﷺ) said: "Sometimes a veil covers my heart, and I seek forgiveness from Allah a hundred times a day."', ref: 'Sahih Muslim 2702', url: 'https://sunnah.com/muslim:2702', grade: 'Sahih' }
      ]
    },
    {
      arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', translit: 'La hawla wa la quwwata illa billah', meaning: 'No power nor strength except with Allah',
      hadith: [
        { arabic: 'أَلَا أَدُلُّكَ عَلَى كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ؟ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', text: 'The Prophet (ﷺ) said to Abu Musa: "Shall I not tell you of a treasure from the treasures of Paradise? It is: La hawla wa la quwwata illa billah."', ref: 'Sahih al-Bukhari 6384', url: 'https://sunnah.com/bukhari:6384', grade: 'Sahih' }
      ]
    },
    {
      arabic: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', translit: 'SubhanAllahi wa bihamdih', meaning: 'Glory and praise be to Allah',
      hadith: [
        { arabic: 'كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ', text: 'The Prophet (ﷺ) said: "(There are) two words which are dear to the Beneficent (Allah) and very light (easy) for the tongue (to say), but very heavy in weight in the balance. They are: Subhan-Allahi wa bihamdihi, Subhan-Allahil-Azim."', ref: 'Sahih al-Bukhari 6682', url: 'https://sunnah.com/bukhari:6682', grade: 'Sahih' }
      ]
    },
    {
      arabic: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ', translit: "Allahumma salli 'ala Muhammad", meaning: 'O Allah, send blessings upon Muhammad',
      hadith: [
        { arabic: 'مَنْ صَلَّى عَلَيَّ صَلَاةً وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرَ صَلَوَاتٍ', text: 'The Prophet (ﷺ) said: "Whoever sends blessings upon me once, Allah will send blessings upon him ten times."', ref: 'Sahih Muslim 408', url: 'https://sunnah.com/muslim:408', grade: 'Sahih' }
      ]
    }
  ];

  const VIRTUES = [
    { text: 'The Prophet (ﷺ) said: "The example of the one who celebrates the Praises of his Lord (Allah) in comparison to the one who does not celebrate the Praises of his Lord, is that of a living creature compared to a dead one."', ref: 'Sahih al-Bukhari 6407', url: 'https://sunnah.com/bukhari:6407' },
    { text: 'Allah has mobile squads of angels who follow the assemblies of Dhikr...', ref: 'Sahih Muslim 2689', url: 'https://sunnah.com/muslim:2689' },
    { text: 'By saying: Subhan Allah a hundred times, then one thousand good deeds will be recorded for him or one thousand sins will be blotted out from his record.', ref: 'Riyad as-Salihin 1431', url: 'https://sunnah.com/riyadussalihin:1431' },
    { text: 'The Prophet (ﷺ) used to remember Allah, the Great and Majestic, at all moments.', ref: 'Sunan Abi Dawud 18', url: 'https://sunnah.com/abudawud:18' }
  ];

  const TARGETS = [33, 99, 100, 500, 1000];

  const K = {
    count: 'dc_count', target: 'dc_target', total: 'dc_total',
    idx: 'dc_idx', vib: 'dc_vib'
  };

  let state = {
    count: parseInt(localStorage.getItem(K.count) || '0', 10),
    target: parseInt(localStorage.getItem(K.target) || '33', 10),
    total: parseInt(localStorage.getItem(K.total) || '0', 10),
    idx: parseInt(localStorage.getItem(K.idx) || '0', 10),
    vib: localStorage.getItem(K.vib) !== 'false'
  };

  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem(K.count, state.count);
    localStorage.setItem(K.target, state.target);
    localStorage.setItem(K.total, state.total);
    localStorage.setItem(K.idx, state.idx);
    localStorage.setItem(K.vib, state.vib);
  }

  function vibe(pattern) {
    if (!state.vib) return;
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function render() {
    const p = PRESETS[state.idx];
    $('arabic').textContent = p.arabic;
    $('translit').textContent = p.translit;
    $('meaning').textContent = p.meaning;
    $('count').textContent = state.count;
    $('targetDisplay').textContent = '/ ' + state.target;
    $('total').textContent = state.total;
    const c = $('counter');
    if (state.count >= state.target && state.count > 0) c.classList.add('done');
    else c.classList.remove('done');
    const tc = $('targetChips');
    tc.innerHTML = '';
    TARGETS.forEach(t => {
      const el = document.createElement('div');
      el.className = 'chip' + (state.target === t ? ' active' : '');
      el.textContent = t;
      el.onclick = () => { state.target = t; state.count = 0; save(); render(); vibe(20); };
      tc.appendChild(el);
    });
    $('vibSwitch').className = 'switch' + (state.vib ? ' on' : '');
  }

  function renderHadith() {
    const p = PRESETS[state.idx];
    $('hadithTitle').textContent = 'Hadith — ' + p.translit;
    const container = $('hadithContent');
    container.innerHTML = '';
    if (!p.hadith || p.hadith.length === 0) {
      container.innerHTML = '<p style="color:#6c8099;font-size:14px;">No specific hadith linked to this dhikr yet.</p>';
      return;
    }
    p.hadith.forEach(h => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML = `<div class="h-arabic">${h.arabic}</div><div class="h-text">${h.text}</div><div class="h-ref"><span>${h.ref}</span><a href="${h.url}" target="_blank">sunnah.com ↗</a></div><div class="h-grade">${h.grade}</div>`;
      container.appendChild(card);
    });
  }

  function renderVirtues() {
    const container = $('virtuesList');
    container.innerHTML = '';
    VIRTUES.forEach(v => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML = `<div class="h-text">${v.text}</div><div class="h-ref"><span>${v.ref}</span><a href="${v.url}" target="_blank">sunnah.com ↗</a></div>`;
      container.appendChild(card);
    });
  }

  /* ============================================================
     FULL HADITH DATASET — AhmedBaset/hadith-json (50,884 hadith)
     https://github.com/AhmedBaset/hadith-json
     ============================================================ */
  const GITHUB_RAW = 'https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book';

  const COLLECTIONS = [
    { file: 'the_9_books/bukhari.json',  name: 'Sahih al-Bukhari',      slug: 'bukhari' },
    { file: 'the_9_books/muslim.json',   name: 'Sahih Muslim',          slug: 'muslim' },
    { file: 'the_9_books/abudawud.json', name: 'Sunan Abi Dawud',       slug: 'abudawud' },
    { file: 'the_9_books/tirmidhi.json', name: "Jami' at-Tirmidhi",     slug: 'tirmidhi' },
    { file: 'the_9_books/nasai.json',    name: "Sunan an-Nasa'i",       slug: 'nasai' },
    { file: 'the_9_books/ibnmajah.json', name: 'Sunan Ibn Majah',       slug: 'ibnmajah' },
    { file: 'the_9_books/malik.json',    name: 'Muwatta Malik',         slug: 'malik' },
    { file: 'the_9_books/ahmad.json',    name: 'Musnad Ahmad',          slug: 'ahmad' },
    { file: 'the_9_books/darimi.json',   name: 'Sunan ad-Darimi',       slug: 'darimi' },
    { file: 'forties/nawawi40.json',     name: '40 Hadith Nawawi',      slug: 'nawawi' },
    { file: 'forties/qudsi40.json',      name: '40 Hadith Qudsi',       slug: 'qudsi' },
    { file: 'forties/shahwaliullah40.json', name: '40 Hadith Shah Waliullah', slug: 'shahwaliullah40' },
    { file: 'other_books/RyadSalihin.json', name: 'Riyad as-Salihin',   slug: 'riyadussalihin' },
    { file: 'other_books/Mishkat.json',  name: 'Mishkat al-Masabih',    slug: 'mishkat' },
    { file: 'other_books/Bulugh.json',   name: 'Bulugh al-Maram',       slug: 'bulugh' },
    { file: 'other_books/Adab.json',     name: 'Al-Adab Al-Mufrad',     slug: 'adab' },
    { file: 'other_books/Shamail.json',  name: "Shama'il Muhammadiyah", slug: 'shamail' }
  ];

  async function fetchWithFallback(path) {
    // Try GitHub raw first (works from GitHub Pages, no CORS issues)
    const urls = [
      'https://raw.githubusercontent.com/AhmedBaset/hadith-json/main/db/by_book/' + path,
      'https://cdn.jsdelivr.net/gh/AhmedBaset/hadith-json@main/db/by_book/' + path
    ];
    let lastErr = null;
    for (const url of urls) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) {
        lastErr = e;
        continue;
      }
    }
    throw lastErr || new Error('All sources failed');
  }

  async function fetchCollection(coll) {
    const cacheKey = 'dc_hadith_' + coll.slug;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try { return JSON.parse(cached); } catch (e) {}
    }
    const data = await fetchWithFallback(coll.file);
    if (!Array.isArray(data) || data.length === 0) {
      throw new Error('Empty collection');
    }
    // Try to cache if not too large (localStorage usually ~5MB limit)
    try {
      const s = JSON.stringify(data);
      if (s.length < 1_500_000) {
        localStorage.setItem(cacheKey, s);
      }
    } catch (e) {}
    return data;
  }

  async function showRandomHadith() {
    const container = $('randomHadithContent');
    container.innerHTML = '<div style="text-align:center;padding:30px;color:#6c8099;"><span class="loading-spinner"></span>Loading hadith...</div>';

    try {
      const coll = COLLECTIONS[Math.floor(Math.random() * COLLECTIONS.length)];
      const hadiths = await fetchCollection(coll);
      const h = hadiths[Math.floor(Math.random() * hadiths.length)];

      const arabic = h.arabic || '';
      const english = (h.english && h.english.text) || h.text || '';
      const narrator = (h.english && h.english.narrator) || '';
      const num = h.id || '?';
      const sunnahUrl = 'https://sunnah.com/' + coll.slug + ':' + num;

      container.innerHTML = `
        <div class="hadith-card" style="border-color: #2a6b9a;">
          <div class="hadith-topic-badge">${coll.name}</div>
          ${arabic ? '<div class="h-arabic">' + arabic + '</div>' : ''}
          ${narrator ? '<div style="font-size:12px;color:#6c8099;margin-bottom:6px;">Narrated by ' + narrator + '</div>' : ''}
          <div class="h-text">${english}</div>
          <div class="h-ref">
            <span>${coll.name} #${num}</span>
            <a href="${sunnahUrl}" target="_blank">sunnah.com ↗</a>
          </div>
        </div>
      `;
    } catch (err) {
      console.error('Hadith fetch error:', err);
      container.innerHTML = `
        <div class="hadith-card" style="border-color:#5a2a2a;">
          <div class="h-text" style="color:#ff9b9b;">Couldn't load: ${err.message}</div>
          <div class="h-text" style="color:#8fa3b8;font-size:12px;margin-top:10px;">Tap "Another Hadith" to try a different collection.</div>
        </div>
      `;
    }
  }

  function tap() {
    if (state.count >= state.target) {
      state.count = 1; state.total += 1; vibe([0, 30]);
    } else {
      state.count += 1; state.total += 1;
      if (state.count === state.target) vibe([0, 80, 60, 80, 60, 120]);
      else vibe([0, 30]);
    }
    save(); render();
  }

  function closeAllSheets() {
    $('hadithSheet').classList.remove('open');
    $('settingsSheet').classList.remove('open');
    $('randomHadithSheet').classList.remove('open');
    $('overlay').classList.remove('open');
  }

  $('counter').addEventListener('click', tap);
  $('undoBtn').onclick = () => {
    if (state.total === 0) return;
    if (state.count > 1) state.count -= 1;
    else if (state.total - 1 >= state.target) state.count = state.target;
    else state.count = 0;
    state.total -= 1; save(); render(); vibe(15);
  };
  $('resetBtn').onclick = () => {
    if (confirm('Reset count and total?')) { state.count = 0; state.total = 0; save(); render(); vibe(15); }
  };
  $('prevBtn').onclick = () => { state.idx = (state.idx - 1 + PRESETS.length) % PRESETS.length; save(); render(); vibe(15); };
  $('nextBtn').onclick = () => { state.idx = (state.idx + 1) % PRESETS.length; save(); render(); vibe(15); };
  $('hadithBtn').onclick = () => { renderHadith(); closeAllSheets(); $('hadithSheet').classList.add('open'); $('overlay').classList.add('open'); };
  $('closeHadith').onclick = closeAllSheets;
  $('settingsBtn').onclick = () => { renderVirtues(); closeAllSheets(); $('settingsSheet').classList.add('open'); $('overlay').classList.add('open'); };
  $('closeSettings').onclick = closeAllSheets;
  $('randomHadithBtn').onclick = () => {
    closeAllSheets();
    $('randomHadithSheet').classList.add('open');
    $('overlay').classList.add('open');
    showRandomHadith();
    vibe(20);
  };
  $('closeRandomHadith').onclick = closeAllSheets;
  $('newRandomHadith').onclick = () => { showRandomHadith(); vibe(15); };
  $('overlay').onclick = closeAllSheets;
  $('vibSwitch').onclick = () => { state.vib = !state.vib; save(); render(); if (state.vib) vibe(30); };
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  render();
})();
</script>
</body>
</html>
