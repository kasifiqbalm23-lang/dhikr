<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dhikr Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0f1720;
    color: #e8eef5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body { display: flex; flex-direction: column; padding: 16px; gap: 12px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: #8fa3b8;
  }
  .topbar button {
    background: #1a2530; color: #e8eef5; border: none;
    padding: 10px 14px; border-radius: 10px; font-size: 16px;
    cursor: pointer;
  }
  .topbar button:active { background: #253240; }

  .dhikr-box { text-align: center; margin-top: 4px; }
  .arabic {
    font-size: 34px; font-weight: 700; line-height: 1.4;
    color: #f0f6ff; direction: rtl;
  }
  .translit { font-size: 17px; color: #a8bdd4; margin-top: 6px; }
  .meaning { font-size: 13px; color: #6c8099; margin-top: 4px; }

  .hadith-btn {
    margin-top: 10px;
    background: #1e3a5f; color: #8fb4d9; border: 1px solid #2a4a6b;
    padding: 8px 18px; border-radius: 20px; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .hadith-btn:active { background: #2a4a6b; }

  .counter-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .counter {
    width: min(68vw, 68vh, 320px);
    height: min(68vw, 68vh, 320px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #1e3a5f, #12293f 70%);
    border: 3px solid #2a4a6b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.06s ease, background 0.2s ease;
    box-shadow: 0 0 40px rgba(58, 130, 200, 0.15) inset;
  }
  .counter:active { transform: scale(0.96); }
  .counter.done {
    background: radial-gradient(circle at 30% 25%, #1e5f3a, #123f29 70%);
    border-color: #2a8b5c;
    box-shadow: 0 0 50px rgba(58, 200, 130, 0.3) inset;
  }
  .count { font-size: 74px; font-weight: 800; line-height: 1; color: #ffffff; }
  .target { font-size: 22px; color: #8fb4d9; margin-top: 6px; }

  .controls {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding-bottom: 60px;
  }
  .controls button {
    background: #1a2530; color: #e8eef5; border: none;
    padding: 12px 20px; border-radius: 12px; font-size: 15px;
    cursor: pointer; font-weight: 600;
  }
  .controls button:active { background: #253240; }
  .controls button.reset { background: #3a1a1a; color: #ff9b9b; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #16202b; border-radius: 20px 20px 0 0;
    padding: 20px 20px 28px; transform: translateY(100%);
    transition: transform 0.25s ease; z-index: 10;
    max-height: 82vh; overflow-y: auto;
    border-top: 1px solid #253240;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h3 { font-size: 15px; color: #8fa3b8; margin-bottom: 10px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip {
    background: #1e2b38; color: #cfe0f0; border: 1px solid #2a3a4a;
    padding: 10px 16px; border-radius: 20px; font-size: 14px;
    cursor: pointer;
  }
  .chip.active { background: #2a6b9a; border-color: #3a90c9; color: #fff; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid #253240;
  }
  .switch {
    width: 50px; height: 28px; border-radius: 14px; background: #2a3a4a;
    position: relative; cursor: pointer; transition: background 0.2s;
  }
  .switch.on { background: #2a6b9a; }
  .switch::after {
    content: ''; position: absolute; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; top: 3px; left: 3px;
    transition: left 0.2s;
  }
  .switch.on::after { left: 25px; }
  .close-sheet {
    width: 100%; padding: 14px; background: #253240; color: #e8eef5;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
    margin-top: 12px; cursor: pointer;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 9;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .hadith-card {
    background: #16202b; border: 1px solid #253240;
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .hadith-card .h-arabic {
    font-size: 20px; line-height: 1.7; direction: rtl;
    color: #f0f6ff; margin-bottom: 10px; text-align: right;
  }
  .hadith-card .h-text {
    font-size: 14px; line-height: 1.6; color: #cfe0f0;
    margin-bottom: 10px;
  }
  .hadith-card .h-ref {
    font-size: 12px; color: #6c8099; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hadith-card .h-ref a {
    color: #5a9fd4; text-decoration: none;
  }
  .hadith-card .h-grade {
    font-size: 11px; color: #4a8a5a; background: #1a2a1e;
    padding: 3px 8px; border-radius: 10px; display: inline-block;
    margin-top: 6px;
  }
  .virtues-list { margin-bottom: 16px; }

  .hadith-topic-badge {
    display: inline-block;
    background: #1e3a5f;
    color: #8fb4d9;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  #randomHadithBtn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    height: 52px;
    border-radius: 26px;
    background: linear-gradient(135deg, #2a6b9a, #1e4a6b);
    border: 2px solid #3a90c9;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(42, 107, 154, 0.5);
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    transition: transform 0.1s;
  }
  #randomHadithBtn:active { transform: scale(0.94); }

  .loading-spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid #2a6b9a;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <button id="settingsBtn">⚙️</button>
  <div>Total: <span id="total">0</span></div>
  <button id="undoBtn">↩</button>
</div>

<div class="dhikr-box">
  <div class="arabic" id="arabic"></div>
  <div class="translit" id="translit"></div>
  <div class="meaning" id="meaning"></div>
  <button class="hadith-btn" id="hadithBtn">📖 Hadith Evidence</button>
</div>

<div class="counter-wrap">
  <div class="counter" id="counter">
    <div class="count" id="count">0</div>
    <div class="target" id="targetDisplay">/ 33</div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">◀</button>
  <button class="reset" id="resetBtn">Reset</button>
  <button id="nextBtn">▶</button>
</div>

<button id="randomHadithBtn" aria-label="Random hadith">📚 Random Hadith</button>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="hadithSheet">
  <h3 id="hadithTitle">Hadith Evidence</h3>
  <div id="hadithContent"></div>
  <button class="close-sheet" id="closeHadith">Close</button>
</div>

<div class="sheet" id="settingsSheet">
  <h3>Target</h3>
  <div class="chips" id="targetChips"></div>

  <h3>Virtues of Dhikr</h3>
  <div class="virtues-list" id="virtuesList"></div>

  <div class="row">
    <span>Vibration</span>
    <div class="switch on" id="vibSwitch"></div>
  </div>

  <button class="close-sheet" id="closeSettings">Done</button>
</div>

<div class="sheet" id="randomHadithSheet" style="max-height: 78vh;">
  <h3>📖 Hadith of the Moment</h3>
  <div id="randomHadithContent"></div>
  <button class="close-sheet" id="newRandomHadith" style="background: #2a6b9a;">📚 Another Hadith</button>
  <button class="close-sheet" id="closeRandomHadith">Close</button>
</div>

    },
    {
      text: 'Allah has mobile squads of angels who follow the assemblies of Dhikr. When they find such assemblies, they sit with them, surrounding them with their wings. Allah asks them: "Where have you come from?" They say: "We come from Your servants who were glorifying You, uttering Your Greatness, uttering Your Oneness, and praising You." Allah says: "I grant them pardon, and confer upon them what they ask for, and grant them protection against which they seek protection."',
      ref: 'Sahih Muslim 2689',
      url: 'https://sunnah.com/muslim:2689'
    },
    {
      text: 'Sa\'d bin Abu Waqqas reported: We were with the Messenger of Allah (ﷺ) when he asked, "Is anyone of you unable to earn a thousand good deeds?" He (ﷺ) replied, "By saying: Subhan Allah a hundred times, then one thousand good deeds will be recorded for him or one thousand sins will be blotted out from his record."',
      ref: 'Riyad as-Salihin 1431',
      url: 'https://sunnah.com/riyadussalihin:1431'
    },
    {
      text: 'The Prophet (ﷺ) used to remember Allah, the Great and Majestic, at all moments.',
      ref: 'Sunan Abi Dawud 18',
      url: 'https://sunnah.com/abudawud:18'
    }
  ];

  /* ============================================================
     CONSTANTS & STATE
     ============================================================ */
  const TARGETS = [33, 99, 100, 500, 1000];

  const K = {
    count: 'dc_count', target: 'dc_target', total: 'dc_total',
    idx: 'dc_idx', vib: 'dc_vib'
  };

  let state = {
    count: parseInt(localStorage.getItem(K.count) || '0', 10),
    target: parseInt(localStorage.getItem(K.target) || '33', 10),
    total: parseInt(localStorage.getItem(K.total) || '0', 10),
    idx: parseInt(localStorage.getItem(K.idx) || '0', 10),
    vib: localStorage.getItem(K.vib) !== 'false'
  };

  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem(K.count, state.count);
    localStorage.setItem(K.target, state.target);
    localStorage.setItem(K.total, state.total);
    localStorage.setItem(K.idx, state.idx);
    localStorage.setItem(K.vib, state.vib);
  }

  function vibe(pattern) {
    if (!state.vib) return;
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    const p = PRESETS[state.idx];
    $('arabic').textContent = p.arabic;
    $('translit').textContent = p.translit;
    $('meaning').textContent = p.meaning;
    $('count').textContent = state.count;
    $('targetDisplay').textContent = '/ ' + state.target;
    $('total').textContent = state.total;

    const c = $('counter');
    if (state.count >= state.target && state.count > 0) {
      c.classList.add('done');
    } else {
      c.classList.remove('done');
    }

    const tc = $('targetChips');
    tc.innerHTML = '';
    TARGETS.forEach(t => {
      const el = document.createElement('div');
      el.className = 'chip' + (state.target === t ? ' active' : '');
      el.textContent = t;
      el.onclick = () => {
        state.target = t;
        state.count = 0;
        save();
        render();
        vibe(20);
      };
      tc.appendChild(el);
    });

    $('vibSwitch').className = 'switch' + (state.vib ? ' on' : '');
  }

  function renderHadith() {
    const p = PRESETS[state.idx];
    $('hadithTitle').textContent = 'Hadith — ' + p.translit;
    const container = $('hadithContent');
    container.innerHTML = '';

    if (!p.hadith || p.hadith.length === 0) {
      container.innerHTML = '<p style="color:#6c8099;font-size:14px;">No specific hadith linked to this dhikr yet.</p>';
      return;
    }

    p.hadith.forEach(h => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML = `
        <div class="h-arabic">${h.arabic}</div>
        <div class="h-text">${h.text}</div>
        <div class="h-ref">
          <span>${h.ref}</span>
          <a href="${h.url}" target="_blank">sunnah.com ↗</a>
        </div>
        <div class="h-grade">${h.grade}</div>
      `;
      container.appendChild(card);
    });
  }

  function renderVirtues() {
    const container = $('virtuesList');
    container.innerHTML = '';
    VIRTUES.forEach(v => {
      const card = document.createElement('div');
      card.className = 'hadith-card';
      card.innerHTML = `
        <div class="h-text">${v.text}</div>
        <div class="h-ref">
          <span>${v.ref}</span>
          <a href="${v.url}" target="_blank">sunnah.com ↗</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  /* ============================================================
     HADITH FETCH — hardcoded collections, multiple URL fallbacks
     ============================================================ */
  const HADITH_COLLECTIONS = [
    { key: 'eng-bukhari',        name: 'Sahih al-Bukhari',      slug: 'bukhari' },
    { key: 'eng-muslim',         name: 'Sahih Muslim',          slug: 'muslim' },
    { key: 'eng-abudawud',       name: 'Sunan Abi Dawud',       slug: 'abudawud' },
    { key: 'eng-tirmidhi',       name: "Jami' at-Tirmidhi",     slug: 'tirmidhi' },
    { key: 'eng-nasai',          name: "Sunan an-Nasa'i",       slug: 'nasai' },
    { key: 'eng-ibnmajah',       name: 'Sunan Ibn Majah',       slug: 'ibnmajah' },
    { key: 'eng-malik',          name: 'Muwatta Malik',         slug: 'malik' },
    { key: 'eng-nawawi',         name: '40 Hadith Nawawi',      slug: 'nawawi' },
    { key: 'eng-qudsi',          name: '40 Hadith Qudsi',       slug: 'qudsi' },
    { key: 'eng-riyadussalihin', name: 'Riyad as-Salihin',      slug: 'riyadussalihin' }
  ];

  async function fetchJSON(url) {
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const t = text.trim();
    if (!t.startsWith('{') && !t.startsWith('[')) throw new Error('Not JSON');
    return JSON.parse(t);
  }

  async function fetchCollection(key) {
    const cacheKey = 'dc_hadith_' + key;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try { return JSON.parse(cached); } catch (e) {}
    }

    const urls = [
      'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/' + key + '.min.json',
      'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/' + key + '.json',
      'https://raw.githubusercontent.com/fawazahmed0/hadith-api/1/editions/' + key + '.json'
    ];

    let lastErr = null;
    for (const url of urls) {
      try {
        const data = await fetchJSON(url);
        if (data && Array.isArray(data.hadiths) && data.hadiths.length > 0) {
          const s = JSON.stringify(data);
          if (s.length < 1_800_000) {
            try { localStorage.setItem(cacheKey, s); } catch (e) {}
          }
          return data;
        }
      } catch (e) {
        lastErr = e;
        continue;
      }
    }
    throw lastErr || new Error('All sources failed for ' + key);
  }

  async function showRandomHadith() {
    const container = $('randomHadithContent');
    container.innerHTML = '<div style="text-align:center;padding:30px;color:#6c8099;"><span class="loading-spinner"></span>Loading hadith...</div>';

    try {
      const coll = HADITH_COLLECTIONS[Math.floor(Math.random() * HADITH_COLLECTIONS.length)];
      const data = await fetchCollection(coll.key);
      const hadiths = data.hadiths;
      const h = hadiths[Math.floor(Math.random() * hadiths.length)];

      const num = h.hadithnumber || h.hadithNumber || h.number || '?';
      const english = h.text || (h.english && h.english.text) || '';
      const arabic = h.arabic || '';
      const sunnahUrl = 'https://sunnah.com/' + coll.slug + ':' + num;

      container.innerHTML = `
        <div class="hadith-card" style="border-color: #2a6b9a;">
          <div class="hadith-topic-badge">${coll.name}</div>
          ${arabic ? '<div class="h-arabic">' + arabic + '</div>' : ''}
          <div class="h-text">${english}</div>
          <div class="h-ref">
            <span>${coll.name} #${num}</span>
            <a href="${sunnahUrl}" target="_blank">sunnah.com ↗</a>
          </div>
        </div>
      `;
    } catch (err) {
      console.error('Hadith fetch error:', err);
      container.innerHTML = `
        <div class="hadith-card" style="border-color:#5a2a2a;">
          <div class="h-text" style="color:#ff9b9b;">
            Couldn't load: ${err.message}
          </div>
          <div class="h-text" style="color:#8fa3b8;font-size:12px;margin-top:10px;">
            Tap "Another Hadith" to try a different collection.
          </div>
        </div>
      `;
    }
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  function tap() {
    if (state.count >= state.target) {
      state.count = 1;
      state.total += 1;
      vibe([0, 30]);
    } else {
      state.count += 1;
      state.total += 1;
      if (state.count === state.target) {
        vibe([0, 80, 60, 80, 60, 120]);
      } else {
        vibe([0, 30]);
      }
    }
    save();
    render();
  }

  function closeAllSheets() {
    $('hadithSheet').classList.remove('open');
    $('settingsSheet').classList.remove('open');
    $('randomHadithSheet').classList.remove('open');
    $('overlay').classList.remove('open');
  }

  /* ============================================================
     EVENT LISTENERS
     ============================================================ */
  $('counter').addEventListener('click', tap);

  $('undoBtn').onclick = () => {
    if (state.total === 0) return;
    if (state.count > 1) {
      state.count -= 1;
    } else if (state.total - 1 >= state.target) {
      state.count = state.target;
    } else {
      state.count = 0;
    }
    state.total -= 1;
    save();
    render();
    vibe(15);
  };

  $('resetBtn').onclick = () => {
    if (confirm('Reset count and total?')) {
      state.count = 0;
      state.total = 0;
      save();
      render();
      vibe(15);
    }
  };

  $('prevBtn').onclick = () => {
    state.idx = (state.idx - 1 + PRESETS.length) % PRESETS.length;
    save(); render(); vibe(15);
  };
  $('nextBtn').onclick = () => {
    state.idx = (state.idx + 1) % PRESETS.length;
    save(); render(); vibe(15);
  };

  $('hadithBtn').onclick = () => {
    renderHadith();
    closeAllSheets();
    $('hadithSheet').classList.add('open');
    $('overlay').classList.add('open');
  };
  $('closeHadith').onclick = closeAllSheets;

  $('settingsBtn').onclick = () => {
    renderVirtues();
    closeAllSheets();
    $('settingsSheet').classList.add('open');
    $('overlay').classList.add('open');
  };
  $('closeSettings').onclick = closeAllSheets;

  $('randomHadithBtn').onclick = () => {
    closeAllSheets();
    $('randomHadithSheet').classList.add('open');
    $('overlay').classList.add('open');
    showRandomHadith();
    vibe(20);
  };
  $('closeRandomHadith').onclick = closeAllSheets;
  $('newRandomHadith').onclick = () => {
    showRandomHadith();
    vibe(15);
  };

  $('overlay').onclick = closeAllSheets;

  $('vibSwitch').onclick = () => {
    state.vib = !state.vib;
    save(); render();
    if (state.vib) vibe(30);
  };

  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  render();
})();
</script>
</body>
</html>
